apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: orders
  labels:
    app: orders-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      initContainers:
        - name: esperar-oracle
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z oracle 1521; do echo esperando a oracle...; sleep 5; done"]
      containers:
        - name: orders-service
          image: ghcr.io/TU_USUARIO/telecom-crud:latest   # <-- cambiar por tu imagen
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: orders-config
            - secretRef:
                name: orders-secret
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
